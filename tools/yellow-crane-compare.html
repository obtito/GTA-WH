<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>黄鹤楼 · 新旧模型对比</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf0f0;color:#27353c;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
header{height:116px;padding:30px 48px;background:#fafbf9;border-bottom:1px solid #d5dcde;display:flex;justify-content:space-between;align-items:center}h1{font-size:32px;letter-spacing:2px;margin:0 0 7px}header p{margin:0;color:#69777c;font-size:16px}.tag{font-size:15px;border:1px solid #ccd7d8;padding:10px 16px;border-radius:30px}
main{display:grid;grid-template-columns:1fr 1fr}.panel{position:relative;border-right:1px solid #d1d9dc}.panel:last-child{border-right:0}.label{position:absolute;left:34px;top:28px;z-index:1}.label strong{display:block;font-size:26px}.label span{display:block;color:#6b7b83;font-size:16px;margin-top:7px}.label b{font-size:12px;letter-spacing:2px;color:#849198;display:block;margin-bottom:8px}canvas{display:block;width:100%;height:850px}.footer{height:80px;padding:20px 34px;background:#fafbf9;border-top:1px solid #d5dcde;line-height:1.7;font-size:15px;color:#65767d}#status{position:fixed;bottom:0;left:0;background:#fff;padding:10px;z-index:5}body.ready #status{display:none}

<header><div><h1>黄鹤楼 · 新旧对比</h1><p>实际模型渲染　/　统一相机、光照与米制比例</p></div><div class="tag">旧版 GLB → 独立代码生成</div></header>
<main><section class="panel"><div class="label"><b>BEFORE</b><strong>旧版 · 导入模型</strong><span>China_Tower GLB + 叠加宝顶与匾额</span></div><canvas id="old"></canvas><div class="footer">保留原有屋顶、朱柱着色与叠加补件。<br>游戏继续使用旧版；新版独立存放。</div></section><section class="panel"><div class="label"><b>AFTER</b><strong>新版 · 代码生成</strong><span>五层折角方形飞檐 · 回廊栏杆 · 葫芦宝顶</span></div><canvas id="new"></canvas><div class="footer">楼高 51.4 m · 约 10.96 万三角面。<br>几何与匾额均由代码生成，无旧模型及外部贴图依赖。</div></section></main><div id="status">正在加载两个模型……</div>
<script type="importmap">{"imports":{"three":"../vendor/three.module.js","three/addons/":"../vendor/"}}</script>
<script type="module">
import * as THREE from 'three';
import { loadGLB } from '../js/assets.js';
import { buildYellowCraneTower } from '../assets/models/huanghe-tower-code/tower.js';
// 对照工具独立加载旧资产，游戏 main.js 不导入此文件。
try {
const oldRoot=new THREE.Group();
const g=await loadGLB('../assets/models/huanghe-tower/huanghe-main-tower-lod2.glb');
if(!g)throw new Error('旧版 GLB 加载失败');
let b=new THREE.Box3().setFromObject(g);g.scale.setScalar(51.4/(b.max.y-b.min.y));g.updateMatrixWorld(true);
b=new THREE.Box3().setFromObject(g);g.position.set(-(b.min.x+b.max.x)/2,-b.min.y-2,-(b.min.z+b.max.z)/2);
g.traverse(o=>{if(!o.isMesh)return;for(const m of Array.isArray(o.material)?o.material:[o.material]){if(!m)continue;if(m.map)m.map.anisotropy=8;if(m.name==='Material #25'){m.color.set('#a87330');m.metalness=0;m.roughness=.78;m.vertexColors=false;m.emissive.set(0x000000);}else if(m.name.endsWith('-008')){m.color.set('#a74432');m.roughness=.75;} }});
oldRoot.add(g);g.updateMatrixWorld(true);const placed=new THREE.Box3().setFromObject(g);
const gold=new THREE.MeshStandardMaterial({color:'#a87330',metalness:0,roughness:.78});
const finial=new THREE.Group();for(const [r,y]of[[1.35,.9],[.85,2.4]]){const m=new THREE.Mesh(new THREE.SphereGeometry(r,18,14),gold);m.position.y=y;finial.add(m);}const rod=new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,1.6,8),gold);rod.position.y=3.5;finial.add(rod);finial.position.y=placed.max.y-.7;oldRoot.add(finial);
const cv=document.createElement('canvas');cv.width=512;cv.height=144;const ctx=cv.getContext('2d');ctx.fillStyle='#14151c';ctx.fillRect(0,0,512,144);ctx.strokeStyle='#c9a227';ctx.lineWidth=8;ctx.strokeRect(6,6,500,132);ctx.fillStyle='#e8c34a';ctx.font='bold 104px KaiTi, STKaiti, serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('黄鹤楼',256,78);const tex=new THREE.CanvasTexture(cv);tex.colorSpace=THREE.SRGBColorSpace;
const plaque=new THREE.Mesh(new THREE.BoxGeometry(6,1.7,.25),[gold,gold,gold,gold,new THREE.MeshStandardMaterial({map:tex,roughness:.6}),gold]);plaque.position.set(0,placed.min.y+43.5,-9.6);plaque.rotation.y=Math.PI;oldRoot.add(plaque);
const newRoot=buildYellowCraneTower();
const renders=[];
for(const [id,model]of[['old',oldRoot],['new',newRoot]]) {
 const canvas=document.getElementById(id),w=canvas.clientWidth,h=850;
 const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});renderer.setSize(w,h,false);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.85;
 renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 const scene=new THREE.Scene();scene.background=new THREE.Color('#edf0f0');scene.add(new THREE.HemisphereLight('#e6efff','#afa590',1.05));
 const sun=new THREE.DirectionalLight('#fff2da',2.6);sun.position.set(-50,100,-65);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-65;sun.shadow.camera.right=65;sun.shadow.camera.top=65;sun.shadow.camera.bottom=-65;sun.shadow.camera.far=250;sun.shadow.bias=-.0003;scene.add(sun);
 const floor=new THREE.Mesh(new THREE.PlaneGeometry(2000,2000),new THREE.MeshStandardMaterial({color:'#edf0eb',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-2.05;floor.receiveShadow=true;scene.add(floor);
 model.traverse(o=>{if(o.isMesh)o.castShadow=o.receiveShadow=true;});scene.add(model);
 const camera=new THREE.PerspectiveCamera(34,w/h,.1,2000);camera.position.set(86,64,-115);camera.lookAt(0,25,0);renders.push({renderer,scene,camera});
}
await document.fonts.ready;
for(const r of renders)r.renderer.render(r.scene,r.camera);
window.__ready=true;document.body.classList.add('ready');
window.__views=renders;
}catch(e){document.getElementById('status').textContent=e.message;console.error(e)}
</script></html>
