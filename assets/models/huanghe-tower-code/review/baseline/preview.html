<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黄鹤楼 · 代码建模备选版</title>
<style>body{margin:0;background:#edf0f0;font-family:-apple-system,"PingFang SC",sans-serif;color:#27353c}header{position:fixed;top:0;left:0;padding:24px 32px;z-index:1}h1{font-size:24px;margin:0 0 8px}p{font-size:14px;margin:0;color:#69777c}canvas{display:block;width:100vw;height:100vh}a{color:#526b77}</style>
<header><h1>黄鹤楼 · 代码建模备选版</h1><p>已独立保存，游戏使用旧版模型。拖动旋转 · 滚轮缩放</p></header><canvas id="scene"></canvas>
<script type="importmap">{"imports":{"three":"../../../vendor/three.module.js","three/addons/":"../../../vendor/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/OrbitControls.js';
import {buildYellowCraneTower} from './tower.js';
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('scene'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.85;
const scene=new THREE.Scene();scene.background=new THREE.Color('#edf0f0');scene.add(new THREE.HemisphereLight('#e6efff','#afa590',1.05));
const sun=new THREE.DirectionalLight('#fff2da',2.6);sun.position.set(-50,100,-65);scene.add(sun);scene.add(buildYellowCraneTower());
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,1000);camera.position.set(86,64,-115);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,25,0);controls.minDistance=35;controls.maxDistance=250;controls.update();
const render=()=>renderer.render(scene,camera);controls.addEventListener('change',render);render();
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();render()});
window.__ready=true;
</script></html>
